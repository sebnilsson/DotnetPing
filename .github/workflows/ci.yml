# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  pull_request:
  push:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
        dotnet-version: 9.0.x

    - name: .NET Build and Test
      uses: ./.github/actions/dotnet-build-test


  telemetry:
    name: Telemetry verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
        dotnet-version: 9.0.x

    - name: Verify telemetry configuration and startup
      run: >
        dotnet test test/DotnetPing.Tests/DotnetPing.Tests.csproj
        --configuration Release
        --filter "FullyQualifiedName~DotnetPing.Tests.Instrumentation"
